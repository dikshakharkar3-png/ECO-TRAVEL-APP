<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Eco Cultural Travel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-bg">

    <div class="login-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-icon">🌿</span>
                <h2 id="loginHeading">Welcome Back</h2>
                <p id="loginSubtext">Login to continue exploring Maharashtra</p>
            </div>

            <form onsubmit="login(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div id="authError" class="auth-error-msg"></div>

                <button type="submit" class="auth-btn">Log In</button>
            </form>

            <div class="auth-footer">
                New to Eco Travel? <a href="signup.html">Create an Account</a>
                <br><br>
                <a href="index.html" style="color: #68756f; font-weight: normal; font-size: 13px;">← Back to Home</a>
            </div>

            <div class="admin-entry-link">
                <a href="login.html?admin=1">Platform Administration</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Purely cosmetic context switch — same form, same login() function, same
        // POST /login call. No new auth path, no secrets, no behavior change: the
        // backend alone decides the role and script.js's redirectByRole() alone
        // decides where a successful login lands.
        if (new URLSearchParams(window.location.search).get("admin") === "1") {
            document.getElementById("loginHeading").textContent = "Platform Administration";
            document.getElementById("loginSubtext").textContent = "Sign in with your administrator credentials.";
            document.getElementById("email").placeholder = "admin@yourcompany.com";
            document.title = "Admin Login - Eco Cultural Travel";
        }
    </script>
</body>
</html>
